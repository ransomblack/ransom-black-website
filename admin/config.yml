backend:
  name: turbo-github
  turbo_site_id: d66606d7-c8bc-419d-8468-802a200930af
  branch: main

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "wall"
    label: "The Wall"
    label_singular: "Wall Post"
    folder: "_wall"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Private editor title", name: "title", widget: "string", hint: "For your admin list only. Keep it short." }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "MMMM D, YYYY", time_format: "h:mm A", picker_utc: false }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - "A Thought"
          - "A Question"
          - "Something I'm Carrying"
          - "A Story"
          - "Song Inspiration"
          - "A Photo"
          - "Something Else"
      - { label: "Displayed name", name: "submitted_by", widget: "string", required: false, hint: "Leave blank to show Anonymous." }
      - { label: "Post text", name: "message", widget: "text", required: false, hint: "Paste the approved thought, story, or question here." }
      - label: "Photo"
        name: "image"
        widget: "image"
        required: false
        choose_url: false
        allow_multiple: false
        media_folder: "/assets/wall"
        public_folder: "/assets/wall"
        hint: "Optional. Only upload a photo the submitter gave permission to share."
      - { label: "Ransom’s Response", name: "ransom_response", widget: "text", required: false, hint: "Optional public reply from Ransom. Leave blank to show no reply." }
      - { label: "This became a song", name: "became_song", widget: "boolean", default: false }
      - { label: "Song title / note", name: "song_note", widget: "string", required: false, hint: "Optional. Example: This one became Where My Strength Begins." }

  - name: "music"
    label: "Music Manager"
    files:
      - name: "releases"
        label: "Singles & Albums"
        file: "music/releases.json"
        format: "json"
        fields:
          - label: "Releases"
            name: "releases"
            widget: "list"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Release type", name: "type", widget: "select", options: ["Single", "Album", "EP"], default: "Single" }
              - { label: "Artwork", name: "cover", widget: "image", choose_url: true }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Release date", name: "release_date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
              - { label: "Visibility", name: "status", widget: "select", options: ["Published", "Coming Soon", "Draft"], default: "Draft" }
              - { label: "Featured release", name: "featured", widget: "boolean", default: false }
              - { label: "Spotify URL", name: "spotify", widget: "string", required: false }
              - { label: "Apple Music URL", name: "apple", widget: "string", required: false }
              - { label: "Amazon Music URL", name: "amazon", widget: "string", required: false }
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
              - { label: "Audio preview URL", name: "preview", widget: "string", required: false }

  - name: "featured_video"
    label: "Featured Video"
    files:
      - name: "homepage_video"
        label: "Homepage Featured Video"
        file: "music/featured-video.json"
        format: "json"
        fields:
          - { label: "Video title", name: "title", widget: "string", hint: "Song or video title shown on the homepage." }
          - { label: "YouTube video URL", name: "youtube_url", widget: "string", hint: "Paste the full YouTube video link, not the channel URL. A video thumbnail is generated automatically." }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Custom thumbnail (optional)", name: "thumbnail", widget: "image", required: false, choose_url: true, hint: "Leave empty to use the YouTube video's thumbnail automatically. Clear the old Ransom image when changing videos." }

  - name: "featured_track"
    label: "Featured Track of the Month"
    files:
      - name: "monthly_track"
        label: "Current Featured Track"
        file: "music/featured-track.json"
        format: "json"
        fields:
          - { label: "Month label", name: "month", widget: "string", hint: "Example: November 2026. Change whenever you're ready; this is a manual feature." }
          - { label: "Section heading", name: "eyebrow", widget: "string", default: "Featured Track of the Month" }
          - { label: "Song title", name: "title", widget: "string" }
          - { label: "Short homepage tagline", name: "tagline", widget: "string" }
          - { label: "Short description", name: "description", widget: "text" }
          - { label: "Behind the song story", name: "story", widget: "text" }
          - { label: "Artwork", name: "artwork", widget: "image", choose_url: true }
          - { label: "Direct audio URL (optional)", name: "audio_url", widget: "string", required: false, hint: "Use a publicly accessible HTTPS MP3 URL for a native audio player. Otherwise a Spotify track URL can display a Spotify player." }
          - { label: "Spotify track URL", name: "spotify_url", widget: "string", required: false }
          - { label: "Apple Music URL", name: "apple_url", widget: "string", required: false }
          - { label: "Amazon Music URL", name: "amazon_url", widget: "string", required: false }
          - { label: "YouTube song URL", name: "youtube_url", widget: "string", required: false }
          - { label: "YouTube music video URL", name: "video_url", widget: "string", required: false }
